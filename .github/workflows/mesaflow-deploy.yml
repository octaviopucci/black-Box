name: Deploy MesaFlow

on:
  push:
    branches: [main]
    paths:
      - 'projects/mesaflow/**'
      - '.github/workflows/mesaflow-deploy.yml'
  workflow_dispatch:

jobs:
  # MesaFlow em produção vive em be-dois / loja-iphoneimports (build-mesaflow.mjs).
  # Hook separado do projeto mesaflow standalone queimava cota free (100 deploys/dia).
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/mesaflow/package-lock.json
      - run: npm --prefix projects/mesaflow ci --include=dev
      - run: npm --prefix projects/mesaflow run vercel-build
