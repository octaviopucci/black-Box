name: Deploy MesaFlow

on:
  push:
    branches: [main]
    paths:
      - 'projects/mesaflow/**'
      - '.github/workflows/mesaflow-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook (mesaflow)
        env:
          HOOK: ${{ secrets.MESAFLOW_VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
            echo "Deploy hook triggered for mesaflow."
          else
            echo "MESAFLOW_VERCEL_DEPLOY_HOOK not configured — skipping."
            echo "Configure em: Vercel → mesaflow → Settings → Deploy Hooks"
          fi

  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/mesaflow/package-lock.json
      - run: npm --prefix projects/mesaflow ci --include=dev
      - run: npm --prefix projects/mesaflow run vercel-build
