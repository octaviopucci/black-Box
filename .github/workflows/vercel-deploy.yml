name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
            echo "Deploy hook triggered."
          else
            echo "VERCEL_DEPLOY_HOOK not configured — skipping."
          fi

  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run vercel-build
      - name: Verify lais-felicia bundle
        run: grep -q "Por dentro do curso" public/lais-felicia/assets/ExperienceV2-*.js
      - name: Verify heitor-da-gelsa bundle
        run: grep -q "Heitor da Gelsa" public/heitor-da-gelsa/index.html
