<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIX Gateway · Black Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #0c1220;
        --bg1: #132038;
        --ink: #e8eef8;
        --muted: #9aa8bf;
        --line: rgba(232, 238, 248, 0.12);
        --accent: #3dd6c6;
        --accent-2: #f0b429;
        --danger: #ff6b7a;
        --ok: #5dde8a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(61, 214, 198, 0.18), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(240, 180, 41, 0.12), transparent 50%),
          linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a101a);
      }
      main {
        width: min(960px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 4rem;
      }
      .brand {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
      }
      .lead {
        color: var(--muted);
        max-width: 38rem;
        line-height: 1.5;
        margin: 0 0 1.75rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr;
      }
      @media (min-width: 840px) {
        .grid { grid-template-columns: 1.1fr 0.9fr; align-items: start; }
      }
      section {
        border: 1px solid var(--line);
        background: rgba(8, 14, 24, 0.55);
        backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 1.15rem 1.2rem 1.3rem;
      }
      h2 {
        margin: 0 0 0.9rem;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0.65rem 0 0.3rem;
      }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.03);
        color: var(--ink);
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
        font: inherit;
      }
      textarea { min-height: 88px; resize: vertical; }
      .row { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
      button {
        margin-top: 0.9rem;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.1rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(120deg, var(--accent), #2bb7e3);
        color: #06201d;
      }
      button.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .pill strong { color: var(--ink); font-weight: 600; }
      .status-ok { color: var(--ok); }
      .status-bad { color: var(--danger); }
      .list { display: grid; gap: 0.65rem; margin-top: 0.8rem; }
      .item {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.75rem 0.85rem;
        font-size: 0.9rem;
      }
      .item small { color: var(--muted); display: block; margin-top: 0.25rem; word-break: break-all; }
      .qr {
        margin-top: 0.9rem;
        text-align: center;
      }
      .qr img {
        width: min(240px, 100%);
        border-radius: 12px;
        background: #fff;
        padding: 0.6rem;
      }
      .copy {
        margin-top: 0.6rem;
        font-size: 0.75rem;
        color: var(--muted);
        word-break: break-all;
        text-align: left;
      }
      .toast {
        margin-top: 0.8rem;
        font-size: 0.85rem;
        color: var(--accent-2);
        min-height: 1.2em;
      }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="pill">Black Box · <strong>PIX Gateway</strong> · taxa R$ 0</p>
      <h1 class="brand">Sua API Pix própria</h1>
      <p class="lead">
        Multi-conta, multi-chave, QR real na sua chave Pix e confirmação automática via webhook.
        API em <code>/api/pix</code>.
      </p>

      <div class="grid">
        <section>
          <h2>Configuração</h2>
          <label>API Key do gateway</label>
          <input id="apiKey" type="password" placeholder="PIX_GATEWAY_API_KEY" />
          <label>Base URL da API</label>
          <input id="baseUrl" value="/api/pix" />
          <div class="actions">
            <button type="button" id="btnHealth">Checar health</button>
            <button type="button" class="secondary" id="btnSave">Salvar no navegador</button>
          </div>
          <p class="toast" id="toast"></p>

          <h2 style="margin-top:1.4rem">Nova conta (grátis)</h2>
          <label>Nome</label>
          <input id="accName" placeholder="Conta Nubank" />
          <div class="row">
            <div>
              <label>Nome no QR</label>
              <input id="merchantName" placeholder="SEU NOME" maxlength="25" />
            </div>
            <div>
              <label>Cidade</label>
              <input id="merchantCity" placeholder="SAO PAULO" maxlength="15" />
            </div>
          </div>
          <label>Webhook token (opcional)</label>
          <input id="webhookToken" placeholder="segredo-do-webhook" />
          <button type="button" id="btnCreateAccount">Criar conta</button>

          <h2 style="margin-top:1.4rem">Chave Pix</h2>
          <label>Account ID</label>
          <input id="accountId" placeholder="acc_..." />
          <div class="row">
            <div>
              <label>Tipo</label>
              <select id="keyType">
                <option value="evp">EVP</option>
                <option value="cpf">CPF</option>
                <option value="cnpj">CNPJ</option>
                <option value="email">E-mail</option>
                <option value="phone">Telefone</option>
              </select>
            </div>
            <div>
              <label>Rótulo</label>
              <input id="keyLabel" placeholder="Principal" />
            </div>
          </div>
          <label>Valor da chave</label>
          <input id="keyValue" placeholder="uuid / cpf / email..." />
          <button type="button" id="btnCreateKey">Adicionar chave</button>
        </section>

        <section>
          <h2>Cobrança</h2>
          <label>Valor (R$)</label>
          <input id="amount" type="number" min="0.01" step="0.01" value="10.00" />
          <label>Descrição</label>
          <input id="description" placeholder="Serviço" />
          <label>Account ID (opcional)</label>
          <input id="chargeAccountId" placeholder="deixe vazio = round robin" />
          <button type="button" id="btnCharge">Gerar Pix</button>
          <div class="qr" id="qrBox" hidden>
            <img id="qrImg" alt="QR Code Pix" />
            <div class="copy" id="copyPaste"></div>
            <div class="actions">
              <button type="button" class="secondary" id="btnCopy">Copiar código</button>
              <button type="button" class="secondary" id="btnRefresh">Atualizar status</button>
            </div>
            <p class="toast" id="chargeStatus"></p>
          </div>

          <h2 style="margin-top:1.4rem">Contas</h2>
          <button type="button" class="secondary" id="btnList">Atualizar listas</button>
          <div class="list" id="accounts"></div>
          <h2 style="margin-top:1.2rem">Últimas cobranças</h2>
          <div class="list" id="charges"></div>
        </section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id)
      const state = {
        lastChargeId: null,
      }

      function toast(msg, ok = true) {
        const el = $('toast')
        el.textContent = msg
        el.className = 'toast ' + (ok ? 'status-ok' : 'status-bad')
      }

      function loadLocal() {
        $('apiKey').value = localStorage.getItem('pix_api_key') || ''
        $('baseUrl').value = localStorage.getItem('pix_base_url') || '/api/pix'
      }

      function saveLocal() {
        localStorage.setItem('pix_api_key', $('apiKey').value.trim())
        localStorage.setItem('pix_base_url', $('baseUrl').value.trim() || '/api/pix')
        toast('Salvo neste navegador')
      }

      async function api(path, options = {}) {
        const base = ($('baseUrl').value.trim() || '/api/pix').replace(/\/$/, '')
        const headers = {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        }
        const key = $('apiKey').value.trim()
        if (key) headers['X-Api-Key'] = key
        const res = await fetch(base + path, { ...options, headers })
        const text = await res.text()
        let data
        try { data = text ? JSON.parse(text) : null } catch { data = { raw: text } }
        if (!res.ok) throw new Error(data?.error || data?.message || res.statusText)
        return data
      }

      async function health() {
        try {
          const data = await api('/health')
          toast(`API ok · fee=${data.fee} · ${data.defaultProvider}`)
        } catch (e) {
          toast(e.message, false)
        }
      }

      async function createAccount() {
        try {
          const data = await api('/v1/accounts', {
            method: 'POST',
            body: JSON.stringify({
              name: $('accName').value.trim() || 'Minha conta',
              provider: 'native',
              merchantName: $('merchantName').value.trim() || 'RECEBEDOR',
              merchantCity: $('merchantCity').value.trim() || 'SAO PAULO',
              webhookToken: $('webhookToken').value.trim() || undefined,
            }),
          })
          $('accountId').value = data.account.id
          $('chargeAccountId').value = data.account.id
          toast(`Conta ${data.account.id} · webhook ${data.webhookUrl}`)
          await refreshLists()
        } catch (e) {
          toast(e.message, false)
        }
      }

      async function createKey() {
        try {
          const accountId = $('accountId').value.trim()
          if (!accountId) throw new Error('Informe accountId')
          await api(`/v1/accounts/${accountId}/keys`, {
            method: 'POST',
            body: JSON.stringify({
              label: $('keyLabel').value.trim() || 'Chave',
              keyType: $('keyType').value,
              keyValue: $('keyValue').value.trim(),
            }),
          })
          toast('Chave adicionada')
          await refreshLists()
        } catch (e) {
          toast(e.message, false)
        }
      }

      async function createCharge() {
        try {
          const amount = Number($('amount').value)
          if (!amount || amount <= 0) throw new Error('Valor inválido')
          const body = {
            amountCents: Math.round(amount * 100),
            description: $('description').value.trim() || undefined,
            routing: 'round_robin',
          }
          const acc = $('chargeAccountId').value.trim()
          if (acc) body.accountId = acc
          const data = await api('/v1/charges', {
            method: 'POST',
            headers: { 'Idempotency-Key': 'ui-' + Date.now() },
            body: JSON.stringify(body),
          })
          state.lastChargeId = data.charge.id
          $('qrBox').hidden = false
          if (data.charge.qrCodeBase64) {
            $('qrImg').src = 'data:image/png;base64,' + data.charge.qrCodeBase64
            $('qrImg').hidden = false
          } else {
            $('qrImg').hidden = true
          }
          $('copyPaste').textContent = data.charge.copyPaste || ''
          $('chargeStatus').textContent = `status: ${data.charge.status} · txid: ${data.charge.txid}`
          toast('Cobrança criada')
          await refreshLists()
        } catch (e) {
          toast(e.message, false)
        }
      }

      async function refreshCharge() {
        if (!state.lastChargeId) return
        try {
          const data = await api(`/v1/charges/${state.lastChargeId}`)
          $('chargeStatus').textContent = `status: ${data.charge.status} · txid: ${data.charge.txid}`
          toast(`Status: ${data.charge.status}`)
          await refreshLists()
        } catch (e) {
          toast(e.message, false)
        }
      }

      async function refreshLists() {
        try {
          const [accounts, charges] = await Promise.all([
            api('/v1/accounts'),
            api('/v1/charges?limit=8'),
          ])
          $('accounts').innerHTML = (accounts.accounts || [])
            .map(
              (a) => `<div class="item"><strong>${a.name}</strong> · ${a.provider} · fee ${a.fee}
              <small>${a.id}</small></div>`,
            )
            .join('') || '<div class="item">Nenhuma conta</div>'
          $('charges').innerHTML = (charges.charges || [])
            .map(
              (c) => `<div class="item"><strong>R$ ${(c.amountCents / 100).toFixed(2)}</strong> · ${c.status}
              <small>${c.id} · ${c.txid}</small></div>`,
            )
            .join('') || '<div class="item">Nenhuma cobrança</div>'
        } catch (e) {
          /* ignore list errors until key is set */
        }
      }

      $('btnSave').onclick = saveLocal
      $('btnHealth').onclick = health
      $('btnCreateAccount').onclick = createAccount
      $('btnCreateKey').onclick = createKey
      $('btnCharge').onclick = createCharge
      $('btnRefresh').onclick = refreshCharge
      $('btnList').onclick = refreshLists
      $('btnCopy').onclick = async () => {
        await navigator.clipboard.writeText($('copyPaste').textContent)
        toast('Copia e cola copiado')
      }

      loadLocal()
      health()
      refreshLists()
    </script>
  </body>
</html>
